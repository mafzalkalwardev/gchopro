name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose env
        run: node scripts/write-ci-env.mjs
      - name: Build
        run: |
          set -a
          . ./.env
          set +a
          pnpm build
      - name: Migrate and seed
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env up -d --wait
          set -a
          . ./.env
          set +a
          pnpm db:migrate
          pnpm db:seed
      - name: Integration tests
        run: |
          set -a
          . ./.env
          set +a
          pnpm test:integration
      - name: Browser tests
        run: |
          set -a
          . ./.env
          set +a
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK 34
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-34" "build-tools;34.0.0"
      - name: Assemble and unit test
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --stacktrace
