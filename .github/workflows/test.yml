name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose env
        run: node scripts/write-ci-env.mjs
      - name: Build
        run: |
          set -a
          . ./.env
          set +a
          pnpm build
      - name: Migrate and seed
        run: |
          docker compose -f infra/docker-compose.yml --env-file .env up -d --wait
          set -a
          . ./.env
          set +a
          pnpm db:migrate
          pnpm db:seed
      - name: Integration tests
        run: |
          set -a
          . ./.env
          set +a
          pnpm test:integration
      - name: Browser tests
        run: |
          set -a
          . ./.env
          set +a
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Backup and restore test
        run: |
          set -a
          . ./.env
          set +a
          sudo apt-get update
          sudo apt-get install -y age rclone postgresql-client
          age-keygen -o "$RUNNER_TEMP/age.key"
          recipient="$(age-keygen -y "$RUNNER_TEMP/age.key")"
          export BACKUP_AGE_RECIPIENT="$recipient"
          export BACKUP_AGE_IDENTITY="$RUNNER_TEMP/age.key"
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          export BACKUP_RCLONE_REMOTE=":local:$RUNNER_TEMP/remote"
          mkdir -p "$BACKUP_DIR" "$RUNNER_TEMP/remote"
          bash infra/backup/backup.sh
          bash infra/backup/restore-test.sh
      - name: Production compose config
        run: |
          GCHOPRO_ENV_FILE="$PWD/.env" docker compose -f infra/docker-compose.prod.yml --env-file .env config --format json > "$RUNNER_TEMP/prod-compose.json"
          node scripts/check-prod-compose.mjs "$RUNNER_TEMP/prod-compose.json"
      - name: Production image
        run: |
          docker build -f infra/Dockerfile -t gchopro:ci .
          docker run --rm --read-only --tmpfs /tmp --user node gchopro:ci bash -c 'pg_dump --version | grep -q " 16\." && node -e "console.log(\"ready\")"'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Assemble and unit test
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --stacktrace
